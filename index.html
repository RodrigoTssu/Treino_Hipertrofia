<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Treino Hipertrofia 5 Dias</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1f242e;
    --border: #2b313e;
    --text: #f3f5f8;
    --muted: #9aa3b2;
    --accent: #3b82f6;
    --accent-soft: rgba(59, 130, 246, 0.16);
    --green: #10b981;
    --green-soft: rgba(16, 185, 129, 0.16);
    --amber: #f59e0b;
    --amber-soft: rgba(245, 158, 11, 0.16);
    --danger: #ef4444;
    --radius: 12px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    padding-bottom: 32px;
  }

  /* Compact Sticky Top Navigation */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(15, 17, 21, 0.96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    max-width: 760px;
    margin: 0 auto 8px auto;
  }

  .app-title {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .top-btn {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }

  .top-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: #93c5fd;
  }

  .day-pills {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    max-width: 760px;
    margin: 0 auto;
    scrollbar-width: none;
  }

  .day-pills::-webkit-scrollbar {
    display: none;
  }

  .day-pill {
    flex: 1;
    min-width: 62px;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.8rem;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .day-pill.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Main Container */
  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 12px;
  }

  .day-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .day-header h1 {
    margin: 0 0 2px 0;
    font-size: 1.05rem;
  }

  .day-header p {
    margin: 0;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .trim-toggle {
    background: var(--surface-2);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
  }

  .trim-toggle.active {
    background: var(--amber-soft);
    border-color: var(--amber);
    color: #fcd34d;
  }

  /* Exercise Cards */
  .exercise-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 10px;
  }

  .ex-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }

  .ex-name {
    font-size: 0.96rem;
    font-weight: 700;
    margin: 0 0 3px 0;
  }

  .ex-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    font-size: 0.76rem;
    color: var(--muted);
  }

  .badge {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 6px;
    font-weight: 600;
    color: #cbd5e1;
  }

  .badge.progress-up {
    background: var(--green-soft);
    border-color: var(--green);
    color: #6ee7b7;
  }

  .ex-note {
    font-size: 0.78rem;
    color: var(--muted);
    margin: 0 0 10px 0;
  }

  /* Single Series Layout: 1 row for R and 1 row for D */
  .sets-grid {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .set-row {
    display: grid;
    grid-template-columns: 32px 1fr 1fr 38px;
    gap: 6px;
    align-items: center;
  }

  .rd-badge {
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82rem;
    font-weight: 800;
    border: 1px solid var(--border);
  }

  .rd-badge.r-tag {
    background: var(--accent-soft);
    border-color: rgba(59, 130, 246, 0.45);
    color: #93c5fd;
  }

  .rd-badge.d-tag {
    background: var(--amber-soft);
    border-color: rgba(245, 158, 11, 0.45);
    color: #fcd34d;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrap input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 30px 8px 10px;
    font-size: 0.9rem;
    font-weight: 600;
    outline: none;
  }

  .input-wrap input:focus {
    border-color: var(--accent);
  }

  .input-unit {
    position: absolute;
    right: 8px;
    font-size: 0.72rem;
    color: var(--muted);
    pointer-events: none;
  }

  .check-btn {
    height: 36px;
    width: 38px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .check-btn.done {
    background: var(--green-soft);
    border-color: var(--green);
    color: var(--green);
  }

  .footer-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .btn-primary {
    flex: 1;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }

  /* Modal Drawer for Summary & History */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    z-index: 100;
    align-items: flex-start;
    justify-content: center;
    padding: 14px;
    overflow-y: auto;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 640px;
    padding: 14px;
    margin-top: 24px;
  }

  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 12px;
  }

  .modal-head h2 {
    margin: 0;
    font-size: 1rem;
  }

  .close-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 5px 10px;
    font-weight: 700;
    cursor: pointer;
  }

  .volume-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
    gap: 8px;
  }

  .vol-item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.82rem;
  }

  .vol-item strong {
    display: block;
    font-size: 0.88rem;
  }

  .history-entry {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    margin-bottom: 8px;
    font-size: 0.82rem;
  }

  .backup-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  .toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e293b;
    color: #fff;
    border: 1px solid var(--accent);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    z-index: 200;
    display: none;
  }
</style>
</head>
<body>

  <header class="top-bar">
    <div class="top-row">
      <div class="app-title">Hipertrofia 5D</div>
      <div class="top-actions">
        <button class="top-btn" id="btnViewWorkout" onclick="setTopMode('workout')">Treino</button>
        <button class="top-btn" id="btnViewSummary" onclick="openModal('summaryModal')">Resumo</button>
        <button class="top-btn" id="btnViewHistory" onclick="openModal('historyModal')">Histórico</button>
      </div>
    </div>
    <nav class="day-pills" id="dayPills"></nav>
  </header>

  <main class="container">
    <section class="day-header">
      <div>
        <h1 id="dayTitle">Segunda — Upper A</h1>
        <p id="daySubtitle">Ênfase: Peito, Costas, Ombro e Abdômen | Meta: ≤ 60 min</p>
      </div>
      <button class="trim-toggle" id="trimBtn" onclick="toggleTrimMode()">Modo 60 min: Normal</button>
    </section>

    <div id="exerciseList"></div>

    <div class="footer-actions">
      <button class="btn-primary" onclick="saveWorkoutLog()">Salvar Treino de Hoje</button>
      <button class="btn-secondary" onclick="clearChecks()">Limpar Checks</button>
    </div>
  </main>

  <!-- Modal Resumo Semanal -->
  <div class="modal-backdrop" id="summaryModal" onclick="closeBackdrop(event, 'summaryModal')">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Resumo Semanal (10 Grupos Musculares)</h2>
        <button class="close-btn" onclick="closeModal('summaryModal')">Fechar</button>
      </div>
      <p style="font-size:0.82rem; color:var(--muted); margin-top:0;">
        Séries válidas diretas planejadas na semana (0–2 RIR), além do estímulo indireto dos compostos:
      </p>
      <div class="volume-list" id="volumeGrid"></div>
    </div>
  </div>

  <!-- Modal Histórico e Backup -->
  <div class="modal-backdrop" id="historyModal" onclick="closeBackdrop(event, 'historyModal')">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Histórico & Backup de Cargas</h2>
        <button class="close-btn" onclick="closeModal('historyModal')">Fechar</button>
      </div>
      <div class="backup-bar">
        <button class="top-btn" onclick="exportBackup()">Exportar Backup (JSON)</button>
        <label class="top-btn" style="cursor:pointer;">
          Importar Backup
          <input type="file" accept=".json" style="display:none;" onchange="importBackup(event)" />
        </label>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const WORKOUT_DATA = {

      { id: "seg_2", name: "Remada Curvada ou Apoiada no Peito", muscle: "Costas / Trapézio", sets: 3, minReps: 6, maxReps: 10, trimmable: false, note: "Puxe com cotovelos firmes, sem roubar lombar." },

    exercises: [
      { id: "ter_1", name: "Agachamento Livre ou Hack Squat", muscle: "Perna (Quadríceps)", sets: 3, minReps: 6, maxReps: 10, trimmable: false, note: "Amplitude completa com tronco firme (1–2 RIR)." },

      { id: "ter_4", name: "Rosca Direta (Barra W ou Cabo)", muscle: "Bíceps", sets: 3, minReps: 10, maxReps: 15, trimmable: false, note: "Cotovelos estáveis ao lado do tronco." },
      { id: "ter_5", name: "Rosca Inversa + Rosca Punho", muscle: "Antebraço", sets: 3, minReps: 12, maxReps: 15, trimmable: true, note: "Controle total na fase excêntrica." }
    ]
  },
  qui: {
    short: "Qui",
    title: "Quinta — Upper B",
    subtitle: "Foco: Ombro, Costas, Peito e Trapézio",
    exercises: [
      { id: "qui_1", name: "Desenvolvimento com Halteres ou Máquina", muscle: "Ombro / Tríceps", sets: 3, minReps: 6, maxReps: 10, trimmable: false, note: "Composto principal de ombro (1–2 RIR)." },
      { id: "qui_2", name: "Remada Baixa Triângulo ou Cavalinho", muscle: "Costas / Trapézio", sets: 3, minReps: 8, maxReps: 12, trimmable: false, note: "Foco em espessura dorsal e retração escapular." },
      { id: "qui_3", name: "Supino Reto Máquina ou Crucifixo/Voador", muscle: "Peito", sets: 3, minReps: 10, maxReps: 12, trimmable: false, note: "Adução máxima do peitoral." },
      { id: "qui_4", name: "Encolhimento com Halteres ou Barra", muscle: "Trapézio", sets: 3, minReps: 10, maxReps: 15, trimmable: true, note: "Eleve os ombros em direção às orelhas com pausa no topo." },
      { id: "qui_5", name: "Crucifixo Inverso (Voador Invertido)", muscle: "Ombro Posterior", sets: 3, minReps: 12, maxReps: 15, trimmable: true, note: "Mantenha punhos neutros e foco no deltoide posterior." }
    ]
  },
  sex: {
    short: "Sex",

    subtitle: "Foco: Posterior de Coxa, Tríceps, Bíceps e Abdômen",
    exercises: [
      { id: "sex_1", name: "Terra Romeno (RDL) ou Mesa Flexora", muscle: "Perna (Posterior)", sets: 3, minReps: 8, maxReps: 12, trimmable: false, note: "Alongamento profundo dos isquiotibiais (1–2 RIR)." },
      { id: "sex_2", name: "Leg Press 45°", muscle: "Perna (Geral)", sets: 3, minReps: 8, maxReps: 12, trimmable: false, note: "Cadência controlada sem tirar o quadril do banco." },
      { id: "sex_3", name: "Tríceps na Polia (Barra ou Corda)", muscle: "Tríceps", sets: 3, minReps: 10, maxReps: 15, trimmable: false, note: "Extensão completa do cotovelo sem jogar o ombro." },
      { id: "sex_4", name: "Rosca Alternada Inclinada ou Scott", muscle: "Bíceps", sets: 3, minReps: 10, maxReps: 15, trimmable: true, note: "Aproveite o alongamento máximo do bíceps." },
      { id: "sex_5", name: "Abdominal Supra no Cabo ou Prancha RKC", muscle: "Abdômen", sets: 3, minReps: 12, maxReps: 15, trimmable: true, note: "Contração abdominal máxima sem puxar com os braços." }
    ]
  },
  sab: {
    short: "Sáb",
    title: "Sábado — Híbrido Tronco Superior",
    subtitle: "Foco: Refinamento Peito, Costas, Ombro, Tríceps e Panturrilha",
    exercises: [
      { id: "sab_1", name: "Supino Inclinado Halteres ou Paralelas", muscle: "Peito / Tríceps", sets: 3, minReps: 8, maxReps: 12, trimmable: false, note: "Segundo estímulo de empurrar na semana." },
      { id: "sab_2", name: "Puxada Neutra ou Barra Fixa", muscle: "Costas / Antebraço", sets: 3, minReps: 8, maxReps: 12, trimmable: false, note: "Amplitude total na extensão dos braços." },
      { id: "sab_3", name: "Elevação Lateral + Tríceps Testa (Conjugado)", muscle: "Ombro / Tríceps", sets: 3, minReps: 12, maxReps: 15, trimmable: false, note: "Alta densidade para fechar tronco superior em menos tempo." },
      { id: "sab_4", name: "Panturrilha Sentado + Pegada/Antebraço", muscle: "Panturrilha / Antebraço", sets: 3, minReps: 12, maxReps: 15, trimmable: true, note: "Finalização rápida de extremidades." }

};

const WEEKLY_SUMMARY = [
  { group: "Peito", sets: "9 séries diretas", detail: "Seg, Qui e Sáb (+ indireto em Desenv.)" },
  { group: "Costas", sets: "9 séries diretas", detail: "Seg (2x), Qui e Sáb" },
  { group: "Ombro", sets: "12 séries diretas", detail: "Seg, Qui (2x) e Sáb" },
  { group: "Trapézio", sets: "3 séries diretas", detail: "Qui + estímulo forte em remadas/RDL" },
  { group: "Bíceps", sets: "6 séries diretas", detail: "Ter e Sex + estímulo em puxadas" },
  { group: "Tríceps", sets: "6 séries diretas", detail: "Sex e Sáb + estímulo em supinos" },
  { group: "Antebraço", sets: "6 séries diretas", detail: "Ter e Sáb + pegada nos compostos" },
  { group: "Perna (Quad + Post)", sets: "12 séries diretas", detail: "Ter (6 séries) e Sex (6 séries)" },
  { group: "Panturrilha", sets: "7 séries diretas", detail: "Ter (4 séries) e Sáb (3 séries)" },
  { group: "Abdômen", sets: "6 séries diretas", detail: "Seg e Sex + estabilização geral" }
];

const STORAGE_KEY = "hipertrofia_5d_state_v6";
let state = loadState();

function createEmptySlot() {
  return { kg: "", reps: "", done: false };
}

function loadState() {
  try {
    const raw =
      localStorage.getItem(STORAGE_KEY) ||
      localStorage.getItem("hipertrofia_5d_state_v5") ||
      localStorage.getItem("hipertrofia_5d_state_v4");
    if (raw) {
      const parsed = JSON.parse(raw);
      const migratedWeights = {};
      if (parsed.weights) {
        Object.keys(parsed.weights).forEach(exId => {
          const entry = parsed.weights[exId];
          if (entry && entry.R && entry.D) {
            migratedWeights[exId] = entry;
          } else if (entry && entry[0] && (entry[0].R || entry[0].D)) {
            migratedWeights[exId] = {
              R: entry[0].R || createEmptySlot(),
              D: entry[0].D || createEmptySlot()
            };
          }
        });
      }
      return {
        activeDay: parsed.activeDay || "seg",
        trim60: !!parsed.trim60,
        weights: migratedWeights,
        history: Array.isArray(parsed.history) ? parsed.history : []
      };
    }
  } catch (e) {}
  return {
    activeDay: "seg",
    trim60: false,
    weights: {},
    history: []
  };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { el.style.display = "none"; }, 2200);
}

function setTopMode(mode) {
  if (mode === "workout") {
    closeModal("summaryModal");
    closeModal("historyModal");
  }
}

function renderTopPills() {
  const container = document.getElementById("dayPills");
  container.innerHTML = "";
  Object.keys(WORKOUT_DATA).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "day-pill" + (state.activeDay === key ? " active" : "");
    btn.textContent = WORKOUT_DATA[key].short;
    btn.onclick = () => {
      state.activeDay = key;
      saveState();
      renderAll();
    };
    container.appendChild(btn);
  });
  document.getElementById("btnViewWorkout").classList.add("active");
}

function toggleTrimMode() {
  state.trim60 = !state.trim60;
  saveState();
  renderAll();
  showToast(state.trim60 ? "Modo 60 min ativado (-1 série nos acessórios)" : "Volume padrão restaurado");
}

function getSlotData(exId, rdKey) {
  if (!state.weights[exId] || !state.weights[exId].R || !state.weights[exId].D) {
    state.weights[exId] = { R: createEmptySlot(), D: createEmptySlot() };
  }
  return state.weights[exId][rdKey];
}

function checkReadyToProgress(ex) {
  const sR = getSlotData(ex.id, "R");
  const r = parseInt(sR.reps, 10);
  return !isNaN(r) && r >= ex.maxReps;
}

function updateProgressBadge(ex) {
  const badgeEl = document.getElementById(`prog_${ex.id}`);
  if (!badgeEl) return;
  badgeEl.style.display = checkReadyToProgress(ex) ? "inline-block" : "none";
}

function updateSlot(exId, rdKey, field, value) {
  const item = getSlotData(exId, rdKey);
  item[field] = value;
  saveState();
  if (field === "reps") {
    const day = WORKOUT_DATA[state.activeDay];
    const ex = day.exercises.find(e => e.id === exId);
    if (ex) updateProgressBadge(ex);
  }
}

function toggleDone(exId, rdKey) {
  const item = getSlotData(exId, rdKey);
  item.done = !item.done;
  saveState();
  const btn = document.getElementById(`chk_${exId}_${rdKey}`);
  if (btn) {
    btn.classList.toggle("done", item.done);
  }
}

function renderExercises() {
  const day = WORKOUT_DATA[state.activeDay];
  document.getElementById("dayTitle").textContent = day.title;
  document.getElementById("daySubtitle").textContent = day.subtitle;

  const trimBtn = document.getElementById("trimBtn");
  trimBtn.textContent = state.trim60 ? "Modo 60 min: Ativo" : "Modo 60 min: Normal";
  trimBtn.className = "trim-toggle" + (state.trim60 ? " active" : "");

  const list = document.getElementById("exerciseList");
  list.innerHTML = "";

  day.exercises.forEach(ex => {
    const effectiveSets = (state.trim60 && ex.trimmable) ? Math.max(2, ex.sets - 1) : ex.sets;
    const canProgress = checkReadyToProgress(ex);
    const sR = getSlotData(ex.id, "R");
    const sD = getSlotData(ex.id, "D");

    const card = document.createElement("div");
    card.className = "exercise-card";

    card.innerHTML = `
      <div class="ex-top">
        <div>
          <h2 class="ex-name">${ex.name}</h2>
          <div class="ex-meta">
            <span class="badge">${ex.muscle}</span>
            <span class="badge">${effectiveSets}x ${ex.minReps}–${ex.maxReps} reps</span>
            <span id="prog_${ex.id}" class="badge progress-up" style="display:${canProgress ? "inline-block" : "none"};">Subir carga!</span>
          </div>
        </div>
      </div>
      <p class="ex-note">${ex.note}</p>
      <div class="sets-grid">
        <div class="set-row">
          <div class="rd-badge r-tag">R</div>
          <div class="input-wrap">
            <input type="number" inputmode="decimal" step="0.5" placeholder="0" value="${sR.kg}"
              oninput="updateSlot('${ex.id}', 'R', 'kg', this.value)" />
            <span class="input-unit">kg</span>
          </div>
          <div class="input-wrap">
            <input type="number" inputmode="numeric" placeholder="${ex.minReps}-${ex.maxReps}" value="${sR.reps}"
              oninput="updateSlot('${ex.id}', 'R', 'reps', this.value)" />
            <span class="input-unit">reps</span>
          </div>
          <button type="button" id="chk_${ex.id}_R"
            class="check-btn ${sR.done ? "done" : ""}"
            onclick="toggleDone('${ex.id}', 'R')"
            title="Concluir R">✓</button>
        </div>

        <div class="set-row">
          <div class="rd-badge d-tag">D</div>
          <div class="input-wrap">
            <input type="number" inputmode="decimal" step="0.5" placeholder="0" value="${sD.kg}"
              oninput="updateSlot('${ex.id}', 'D', 'kg', this.value)" />
            <span class="input-unit">kg</span>
          </div>
          <div class="input-wrap">
            <input type="number" inputmode="numeric" placeholder="${ex.minReps}-${ex.maxReps}" value="${sD.reps}"
              oninput="updateSlot('${ex.id}', 'D', 'reps', this.value)" />
            <span class="input-unit">reps</span>
          </div>
          <button type="button" id="chk_${ex.id}_D"
            class="check-btn ${sD.done ? "done" : ""}"
            onclick="toggleDone('${ex.id}', 'D')"
            title="Concluir D">✓</button>
        </div>
      </div>
    `;
    list.appendChild(card);
  });
}

function saveWorkoutLog() {
  const day = WORKOUT_DATA[state.activeDay];
  const dateStr = new Date().toLocaleDateString("pt-BR");
  const summaryLines = [];

  day.exercises.forEach(ex => {
    const sR = getSlotData(ex.id, "R");
    const sD = getSlotData(ex.id, "D");
    const parts = [];
    if (sR.kg || sR.reps) parts.push(`R: ${sR.kg || 0}kg x ${sR.reps || 0}`);
    if (sD.kg || sD.reps) parts.push(`D: ${sD.kg || 0}kg x ${sD.reps || 0}`);
    if (parts.length > 0) {
      summaryLines.push(`${ex.name}: ${parts.join(" | ")}`);
    }
  });

  if (summaryLines.length === 0) {
    showToast("Preencha ao menos uma carga ou repetição antes de salvar.");
    return;
  }

  state.history.unshift({
    date: dateStr,
    dayTitle: day.title,
    details: summaryLines
  });

  saveState();
  showToast("Treino salvo no histórico!");
}

function clearChecks() {
  const day = WORKOUT_DATA[state.activeDay];
  day.exercises.forEach(ex => {
    if (state.weights[ex.id]) {
      if (state.weights[ex.id].R) state.weights[ex.id].R.done = false;
      if (state.weights[ex.id].D) state.weights[ex.id].D.done = false;
    }
  });
  saveState();
  renderExercises();
  showToast("Checks desmarcados (cargas mantidas).");
}

function renderSummaryModal() {
  const grid = document.getElementById("volumeGrid");
  grid.innerHTML = WEEKLY_SUMMARY.map(item => `
    <div class="vol-item">
      <strong>${item.group}</strong>
      <div style="color:#6ee7b7; font-weight:600; margin:2px 0;">${item.sets}</div>
      <div style="color:var(--muted); font-size:0.76rem;">${item.detail}</div>
    </div>
  `).join("");
}

function renderHistoryModal() {
  const list = document.getElementById("historyList");
  if (!state.history || state.history.length === 0) {
    list.innerHTML = `<p style="color:var(--muted); font-size:0.84rem;">Nenhum treino salvo ainda. Preencha suas cargas na tela principal e toque em "Salvar Treino de Hoje".</p>`;
    return;
  }
  list.innerHTML = state.history.map(entry => `
    <div class="history-entry">
      <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
        <strong>${entry.dayTitle}</strong>
        <span style="color:var(--muted);">${entry.date}</span>
      </div>
      <div style="color:#cbd5e1; font-size:0.78rem; line-height:1.45;">
        ${entry.details.map(d => `• ${d}`).join("<br>")}
      </div>
    </div>
  `).join("");
}

function openModal(id) {
  if (id === "summaryModal") renderSummaryModal();
  if (id === "historyModal") renderHistoryModal();
  document.getElementById(id).classList.add("open");
}

function closeModal(id) {
  document.getElementById(id).classList.remove("open");
}

function closeBackdrop(event, id) {
  if (event.target.id === id) closeModal(id);
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "backup_treino_hipertrofia.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (parsed && parsed.weights) {
        state = parsed;
        saveState();
        renderAll();
        renderHistoryModal();
        showToast("Backup restaurado com sucesso!");
      }
    } catch (err) {
      showToast("Arquivo JSON inválido.");
    }
  };
  reader.readAsText(file);
}

function renderAll() {
  renderTopPills();
  renderExercises();
}

renderAll();
</script>
</body>
</html>
